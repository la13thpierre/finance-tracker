<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finance Tracker</title>
<title>Finance Tracker — Dashboard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💰</text></svg>">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  .logout-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
  font-size: 12px;
  padding: 6px 12px;
  border-radius: 8px;
  cursor: pointer;
  margin-left: 12px;
}
.logout-btn:hover {
  color: var(--text);
  border-color: var(--muted);
}
  :root {
    --bg: #0f1117;
    --card: #1a1d27;
    --border: #2a2e3a;
    --text: #e4e6eb;
    --muted: #8b8f9c;
    --accent: #4f8cff;
    --green: #3ecf8e;
    --red: #ff5c5c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 32px;
  }
  h1 {
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 24px;
  }

  /* Stat row */
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
  }
  .stat-card h3 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin: 0 0 6px;
    font-weight: 500;
  }
  .stat-card .value {
    font-size: 22px;
    font-weight: 700;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
    margin-bottom: 24px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }
  .card h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin: 0 0 12px;
  }
  .balance-value {
    font-size: 32px;
    font-weight: 700;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  th {
    text-align: left;
    color: var(--muted);
    font-weight: 500;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  td {
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .amount-negative { color: var(--red); }
  .amount-positive { color: var(--green); }
  canvas { max-height: 240px; }

  .budget-track { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
  .budget-fill { height: 100%; background: var(--green); }
  .budget-fill.over { background: var(--red); }
  .budget-form input {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 6px 10px; font-size: 13px;
  }

  /* Loading state */
  .skeleton {
    background: linear-gradient(90deg, var(--border) 25%, #333844 50%, var(--border) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
    border-radius: 6px;
    height: 20px;
    width: 100%;
  }
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* Empty / error state */
  .empty-state {
    text-align: center;
    color: var(--muted);
    padding: 24px 0;
    font-size: 14px;
  }

  /* Responsive tweaks */
  @media (max-width: 600px) {
    body { padding: 16px; }
    h1 { font-size: 18px; }
    .stat-card .value { font-size: 18px; }
    .balance-value { font-size: 26px; }
    table { font-size: 12px; }
    th:nth-child(2), td:nth-child(2) { display: none; } /* hide category col on mobile */
  }
</style>
</head>
<body>

<nav class="navbar">
  <div class="nav-container">
    <div class="nav-brand">
     <span class="nav-logo">Finance Tracker</span>
    </div>
   <div class="nav-meta">
  <span id="lastUpdated" class="nav-updated"></span>
  <button id="logoutBtn" class="logout-btn">Log out</button>
</div>
  </div>
</nav>

<div class="page-header">
  <p class="page-subtitle">Personal Finance Tracker — DevOps Portfolio Project</p>
</div>

<div class="card" style="margin-bottom:24px; display:flex; gap:12px; align-items:center;">
  <label style="font-size:13px; color:var(--muted);">From <input type="date" id="fromDate"></label>
  <label style="font-size:13px; color:var(--muted);">To <input type="date" id="toDate"></label>
  <button id="applyFilter" class="logout-btn">Apply</button>
</div>

<div class="stats" id="statsRow">
  <div class="stat-card">
    <h3>This Month's Spend</h3>
    <div class="value" id="monthSpend"><div class="skeleton"></div></div>
  </div>
  <div class="stat-card">
    <h3>Top Category</h3>
    <div class="value" id="topCategory"><div class="skeleton"></div></div>
  </div>
  <div class="stat-card">
    <h3>Transaction Count</h3>
    <div class="value" id="txCount"><div class="skeleton"></div></div>
  </div>
</div>

<div class="grid">
  <div class="card">
    <h2>Balance</h2>
    <div class="balance-value" id="balance"><div class="skeleton"></div></div>
  </div>
  <div class="card">
    <h2>Spend by Category</h2>
    <canvas id="categoryChart"></canvas>
  </div>
  <div class="card">
    <h2>Balance Trend</h2>
    <canvas id="trendChart"></canvas>
  </div>
</div>

<div class="card" style="margin-bottom:24px;">
  <h2>Budgets (this month)</h2>
  <div id="budgets"><div class="skeleton"></div></div>
  <div class="budget-form" style="display:flex; gap:8px; margin-top:16px; flex-wrap:wrap;">
    <input id="budgetCategory" placeholder="Category (e.g. Food & Drink)">
    <input id="budgetLimit" type="number" placeholder="Monthly limit">
    <button id="saveBudget" class="logout-btn" style="margin-left:0;">Set budget</button>
  </div>
</div>

<div class="card">
  <h2>Recent Transactions</h2>
  <table>
    <thead>
      <tr><th>Merchant</th><th>Category</th><th>Date</th><th style="text-align:right">Amount</th></tr>
    </thead>
    <tbody id="transactions">
      <tr><td colspan="4"><div class="skeleton"></div></td></tr>
    </tbody>
  </table>
</div>

<script>
  const API_BASE = "http://localhost:4003"; // update to your reporting-service forwarded URL

  const token = localStorage.getItem("ft_token");
if (!token) {
window.location.href = "login.html";
}
document.getElementById("logoutBtn").addEventListener("click", () => {
  localStorage.removeItem("ft_token");
  window.location.href = "login.html";
});
document.getElementById("applyFilter").addEventListener("click", loadDashboard);
  function showError(elementId, message = "Couldn't load data") {
    document.getElementById(elementId).innerHTML =
      `<div class="empty-state">${message}</div>`;
  }

  async function loadDashboard() {
    let balance, spend, transactions;

    try {
     const authHeader = { headers: { Authorization: `Bearer ${token}` } };
    const from = document.getElementById("fromDate").value;
    const to = document.getElementById("toDate").value;
    const params = new URLSearchParams();
    if (from) params.set("from", from);
    if (to) params.set("to", to);
    const qs = params.toString() ? `?${params.toString()}` : "";
    const [balanceRes, spendRes, txRes] = await Promise.all([
  fetch(`${API_BASE}/balance`, authHeader),
  fetch(`${API_BASE}/spend-by-category${qs}`, authHeader),
  fetch(`${API_BASE}/transactions${qs}`, authHeader)
]);

if (balanceRes.status === 401 || spendRes.status === 401 || txRes.status === 401) {
  localStorage.removeItem("ft_token");
  window.location.href = "login.html";
  return;
}

balance = await balanceRes.json();
spend = await spendRes.json();
transactions = await txRes.json();
    } catch (err) {
      console.error("Failed to load dashboard data:", err);
      showError("balance", "—");
      showError("categoryChart", "No data available");
      showError("transactions", "Couldn't load transactions. Is reporting-service running?");
      showError("monthSpend", "—");
      showError("topCategory", "—");
      showError("txCount", "—");
      return;
    }

    // Balance
    document.getElementById("balance").textContent =
      `$${Number(balance.balance).toFixed(2)}`;

    // Category chart + stats
    if (spend.length === 0) {
      showError("categoryChart", "No spending data yet");
      showError("topCategory", "—");
    } else {
      const sortedSpend = [...spend].sort((a, b) => b.total - a.total);
      const categories = sortedSpend.map(s => s.category);
      const totals = sortedSpend.map(s => s.total);

      new Chart(document.getElementById("categoryChart"), {
        type: "doughnut",
        data: {
          labels: categories,
          datasets: [{
            data: totals,
            backgroundColor: ["#4f8cff", "#3ecf8e", "#ffb84f", "#ff5c5c", "#a56eff", "#4fd6ff"]
          }]
        },
        options: { plugins: { legend: { labels: { color: "#e4e6eb" } } } }
      });

      const topIdx = totals.indexOf(Math.max(...totals));
      document.getElementById("topCategory").textContent = categories[topIdx];

      const monthTotal = totals.reduce((a, b) => a + b, 0);
      document.getElementById("monthSpend").textContent = `$${monthTotal.toFixed(2)}`;
    }

    // Transactions table + trend chart + count
    if (transactions.length === 0) {
      document.getElementById("transactions").innerHTML =
        `<tr><td colspan="4"><div class="empty-state">No transactions yet</div></td></tr>`;
      showError("trendChart", "No trend data yet");
      document.getElementById("txCount").textContent = "0";
    } else {
      document.getElementById("txCount").textContent = transactions.length;

      const tbody = document.getElementById("transactions");
      tbody.innerHTML = "";
      transactions.forEach(tx => {
        const row = document.createElement("tr");
        const amountClass = tx.amount < 0 ? "amount-negative" : "amount-positive";
        row.innerHTML = `
          <td>${tx.merchant}</td>
          <td>${tx.category}</td>
          <td>${new Date(tx.date).toLocaleDateString()}</td>
          <td style="text-align:right" class="${amountClass}">$${Math.abs(tx.amount).toFixed(2)}</td>
        `;
        tbody.appendChild(row);
      });

      // Build a running balance trend from transactions, oldest to newest
      const sorted = [...transactions].sort((a, b) => new Date(a.date) - new Date(b.date));
      let running = 0;
      const trendLabels = [];
      const trendData = [];
      sorted.forEach(tx => {
        running += tx.amount;
        trendLabels.push(new Date(tx.date).toLocaleDateString());
        trendData.push(running);
      });

      new Chart(document.getElementById("trendChart"), {
        type: "line",
        data: {
          labels: trendLabels,
          datasets: [{
            label: "Balance",
            data: trendData,
            borderColor: "#4f8cff",
            backgroundColor: "rgba(79,140,255,0.15)",
            fill: true,
            tension: 0.3,
            pointRadius: 2
          }]
        },
        options: {
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: "#8b8f9c" }, grid: { color: "#2a2e3a" } },
            y: { ticks: { color: "#8b8f9c" }, grid: { color: "#2a2e3a" } }
          }
        }
      });
    }
        document.getElementById("lastUpdated").textContent =
      `Last updated: ${new Date().toLocaleTimeString()}`;
  }

  async function loadBudgets() {
    const box = document.getElementById("budgets");
    try {
      const res = await fetch(`${API_BASE}/budgets`, { headers: { Authorization: `Bearer ${token}` } });
      if (res.status === 401) {
        localStorage.removeItem("ft_token");
        window.location.href = "login.html";
        return;
      }
      const budgets = await res.json();
      if (budgets.length === 0) {
        showError("budgets", "No budgets yet. Set one below.");
        return;
      }
      box.innerHTML = "";
      budgets.forEach(b => {
        const spent = Math.abs(b.spent);
        const pct = Math.min(100, (spent / b.limit) * 100);

        const row = document.createElement("div");
        row.style.marginBottom = "14px";

        const label = document.createElement("div");
        label.style.cssText = "display:flex; justify-content:space-between; font-size:14px; margin-bottom:6px;";
        const name = document.createElement("span");
        name.textContent = b.category;
        const amounts = document.createElement("span");
        amounts.textContent = `$${spent.toFixed(2)} / $${b.limit.toFixed(2)}`;
        label.append(name, amounts);

        const track = document.createElement("div");
        track.className = "budget-track";
        const fill = document.createElement("div");
        fill.className = "budget-fill" + (spent > b.limit ? " over" : "");
        fill.style.width = pct + "%";
        track.appendChild(fill);

        row.append(label, track);
        box.appendChild(row);
      });
    } catch (err) {
      console.error("Failed to load budgets:", err);
      showError("budgets", "Couldn't load budgets");
    }
  }

  document.getElementById("saveBudget").addEventListener("click", async () => {
    const category = document.getElementById("budgetCategory").value.trim();
    const monthly_limit = Number(document.getElementById("budgetLimit").value);
    if (!category || !(monthly_limit > 0)) return;
    await fetch(`${API_BASE}/budgets/${encodeURIComponent(category)}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
      body: JSON.stringify({ monthly_limit })
    });
    document.getElementById("budgetLimit").value = "";
    loadBudgets();
  });

  loadDashboard();
  loadBudgets();
</script>

</body>
</html>
