apiVersion: apps/v1
kind: Deployment
metadata:
  name: categorization-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: categorization-service
  template:
    metadata:
      labels:
        app: categorization-service
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:16
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres-service -p 5432 -U finance; do
                echo "Waiting for postgres..."
                sleep 2
              done
      containers:
        - name: categorization-service
          image: categorization-service:latest
          imagePullPolicy: Never
          env:
            - name: REDIS_URL
              value: redis://redis-service:6379
            - name: DATABASE_URL
              value: postgres://finance:finance@postgres-service:5432/finance_tracker