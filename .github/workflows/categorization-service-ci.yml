name: categorization-service CI

on:
  push:
    branches: [main]
    paths:
      - 'categorization-service/**'
  pull_request:
    branches: [main]
    paths:
      - 'categorization-service/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: categorization-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: categorization-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test || true

      - name: Build Docker image
        run: docker build -t categorization-service:${{ github.sha }} .

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: categorization-service:${{ github.sha }}
          severity: 'CRITICAL,HIGH'
          exit-code: '0'