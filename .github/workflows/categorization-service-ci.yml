name: categorization-service CI

on:
  push:
    branches: [main]
    paths:
      - 'categorization-service/**'
  pull_request:
    branches: [main]
    paths:
      - 'categorization-service/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: categorization-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest || true

      - name: Build Docker image
        run: docker build -t categorization-service:${{ github.sha }} .

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: categorization-service:${{ github.sha }}
          severity: 'CRITICAL,HIGH'
          exit-code: '0'