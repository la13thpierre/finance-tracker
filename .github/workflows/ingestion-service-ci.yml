name: ingestion-service CI

on:
  push:
    branches: [main]
    paths:
      - 'ingestion-service/**'
  pull_request:
    branches: [main]
    paths:
      - 'ingestion-service/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingestion-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build Docker image
        run: docker build -t ingestion-service:${{ github.sha }} .

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ingestion-service:${{ github.sha }}
          severity: 'CRITICAL,HIGH'
          exit-code: '0'