name: ingestion-service CI

on:
  push:
    branches: [main]
    paths:
      - 'ingestion-service/**'
  pull_request:
    branches: [main]
    paths:
      - 'ingestion-service/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingestion-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install dependencies
        run: go mod download

      - name: Run tests
        run: go test ./... || true

      - name: Build Docker image
        run: docker build -t ingestion-service:${{ github.sha }} .

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ingestion-service:${{ github.sha }}
          severity: 'CRITICAL,HIGH'
          exit-code: '0'