name: reporting-service CI

on:
  push:
    branches: [main]
    paths:
      - 'reporting-service/**'
      - '.github/workflows/reporting-service-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'reporting-service/**'
      - '.github/workflows/reporting-service-ci.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reporting-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: reporting-service/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test --if-present

      - name: Build Docker image
        run: docker build -t reporting-service:${{ github.sha }} .

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: reporting-service:${{ github.sha }}
          severity: 'CRITICAL,HIGH'
          exit-code: '0'